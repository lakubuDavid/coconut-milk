name: Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install luajit
        run: brew install luajit

      - name: Configure
        run: xmake f -c -m ${{ matrix.mode }}

      - name: Build
        run: xmake build tests

      - name: Run tests
        run: ./build/macosx/$(uname -m)/${{ matrix.mode }}/tests

  test-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev

      - name: Configure
        run: xmake f -c -m ${{ matrix.mode }}

      - name: Build
        run: xmake build tests

      - name: Run tests
        run: ./build/linux/$(uname -m)/${{ matrix.mode }}/tests
