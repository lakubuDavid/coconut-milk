name: Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# NOTE: xmake steps run with working-directory: apps/coconut — the project
# xmake.lua lives there, not at the repo root.

jobs:
  test-macos:
    runs-on: macos-15  # Xcode 16: -std=c++26 supported (matches dev machines)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, asan]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install luajit
        run: brew install luajit

      - name: Apply webview patch (on_configure_config)
        run: |
          cd apps/coconut/thirdparty/webview
          if git apply --check "$GITHUB_WORKSPACE/patches/webview-on_configure_config.patch" 2>/dev/null; then
            git apply "$GITHUB_WORKSPACE/patches/webview-on_configure_config.patch"
            echo "webview patch applied"
          else
            echo "webview patch already applied or not needed"
          fi

      - name: Configure
        working-directory: apps/coconut
        run: xmake f -c -m ${{ matrix.mode }} -y

      - name: Build
        working-directory: apps/coconut
        run: xmake build tests

      - name: Run tests
        working-directory: apps/coconut
        run: ./build/macosx/$(uname -m)/${{ matrix.mode }}/tests

  test-linux:
    runs-on: ubuntu-24.04  # GCC 13: <expected> + C++23 support
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, asan]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev

      - name: Configure
        working-directory: apps/coconut
        run: xmake f -c -m ${{ matrix.mode }} -y

      - name: Build
        working-directory: apps/coconut
        run: xmake build tests

  test-tsan:
    # ThreadSanitizer catches data races in the worker-thread + dispatch
    # pipeline. Linux only: TSAN produces heavy false positives against the
    # macOS Objective-C runtime, and the project is Cocoa-bound on macOS.
    #
    # Expected to surface races in the legacy dispatch::Outbox / dispatch::post
    # path — those are tracked for the v0.2.0 dispatcher port (core::Dispatcher
    # owned by App). Kept non-blocking so the pipeline stays green while the
    # port lands, but failures here are real signal, not noise.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev

      - name: Configure
        working-directory: apps/coconut
        run: xmake f -c -m tsan -y

      - name: Build
        working-directory: apps/coconut
        run: xmake build tests

      - name: Run tests
        working-directory: apps/coconut
        run: TSAN_OPTIONS=halt_on_error=0 ./build/linux/$(uname -m)/tsan/tests

