name: Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: debug, task: test }
          - { mode: asan,  task: test-asan }

    steps:
      - uses: actions/checkout@v4

      # Installs mise itself, all tools declared in mise.toml
      # (incl. clang), and trusts the monorepo config.
      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # Runs from apps/coconut (task config_root): configure + build +
      # execute the suite with the mode-appropriate task.
      - name: Test (${{ matrix.mode }})
        run: mise run ${{ matrix.task }}

  test-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: debug, task: test }
          - { mode: asan,  task: test-asan }

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libluajit-5.1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev

      - name: Test (${{ matrix.mode }})
        run: mise run ${{ matrix.task }}
