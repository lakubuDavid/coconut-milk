# Build artifacts for the coconut-milk release.
# Triggered by pushing a tag matching v*.*.* or manually.
name: build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      test_install:
        description: "Run install script tests after build"
        type: boolean
        default: false
        required: false

env:
  # Path to the webview monkey-patch for custom URL scheme handler
  WEBVIEW_PATCH: patches/webview-on_configure_config.patch

jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply webview patch (on_configure_config)
        run: |
          cd thirdparty/webview
          if git apply --check "$GITHUB_WORKSPACE/$WEBVIEW_PATCH" 2>/dev/null; then
            git apply "$GITHUB_WORKSPACE/$WEBVIEW_PATCH"
            echo "  ✓ webview patch applied"
          else
            echo "  - webview patch already applied or not needed"
          fi

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (download deps)
        run: xmake f -m release -p macosx -a ${{ matrix.arch }} -y

      - name: Build coconut binary
        run: xmake build -v coconut

      - name: Build and run tests
        run: |
          xmake build -v tests
          xmake run tests

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: coconut-macos-${{ matrix.arch }}
          path: build/macosx/${{ matrix.arch }}/release/coconut

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnotify-dev \
            xvfb

      - name: Apply webview patch
        run: |
          cd thirdparty/webview
          if git apply --check "$GITHUB_WORKSPACE/$WEBVIEW_PATCH" 2>/dev/null; then
            git apply "$GITHUB_WORKSPACE/$WEBVIEW_PATCH"
            echo "  ✓ webview patch applied"
          else
            echo "  - webview patch already applied or not needed"
          fi

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (download deps)
        run: xmake f -m release -p linux -a x86_64 -y

      - name: Build coconut binary
        run: xmake build -v coconut

      - name: Build tests
        run: xmake build -v tests

      - name: Run tests (headless via xvfb)
        run: xvfb-run xmake run tests

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: coconut-linux-x86_64
          path: build/linux/x86_64/release/coconut

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install WebView2 SDK headers
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:USERPROFILE\.nuget\packages" -ExcludeVersion
          $webview2Path = Resolve-Path "$env:USERPROFILE\.nuget\packages\microsoft.web.webview2\*\build\native\include"
          echo "WebView2 SDK at: $webview2Path"
          echo "WEBVIEW2_INCLUDE=$webview2Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (download deps)
        # Use x64 (not x86_64) which matches MSVC's toolchain naming
        # WEBVIEW2_INCLUDE points to the NuGet WebView2 SDK headers
        run: xmake f -m release -p windows -a x64 --cxflags="-I$env:WEBVIEW2_INCLUDE" -y

      - name: Build coconut binary
        run: xmake build -v coconut

      - name: Build tests
        run: xmake build -v tests

      - name: Run tests
        run: xmake run tests
        continue-on-error: true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: coconut-windows-x86_64
          path: build/windows/x64/release/coconut.exe

  build-vite-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package coconut-vite as npm tarball
        run: |
          mkdir -p dist
          cd packages/coconut-vite
          npm pack --pack-destination ../../dist/

      - name: Upload vite package
        uses: actions/upload-artifact@v4
        with:
          name: coconut-vite-package
          path: dist/coconut-vite-*.tgz

  source-archive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive (zip + tar.gz)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          mkdir -p dist

          # Determine the commit the tag points to
          COMMIT="${GITHUB_SHA}"
          if [ -z "$COMMIT" ]; then
            COMMIT="$(git rev-parse HEAD)"
          fi

          ARCHIVE_NAME="coconut-milk-${TAG}-source"

          # git archive creates a tar from the tree at COMMIT (no .git/
          # thirdparty/.git, CI artifacts, etc.)
          git archive --format=tar --prefix="${ARCHIVE_NAME}/" "${COMMIT}" \
            > "${ARCHIVE_NAME}.tar"

          # tar.gz
          gzip -c "${ARCHIVE_NAME}.tar" > "dist/${ARCHIVE_NAME}.tar.gz"

          # zip — extract tar to tmpdir, zip from there, clean up
          mkdir -p tmp_src_extract
          (cd tmp_src_extract && tar xf "../${ARCHIVE_NAME}.tar")
          (cd tmp_src_extract && zip -9 -q -r "../dist/${ARCHIVE_NAME}.zip" .)
          rm -rf tmp_src_extract "${ARCHIVE_NAME}.tar"

          ls -lh dist/

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: coconut-source-archive
          path: dist/*

  package:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows, build-vite-package, source-archive]

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts into platform zips
        shell: bash
        run: |
          # Rename raw binaries so they don't collide (artifacts/**/* flattens dirs)
          # then zip each platform+arch for easy download.
          mkdir -p dist
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            case "$name" in
              coconut-macos-*)
                if [ -f "$dir/coconut" ]; then
                  cp "$dir/coconut" "dist/$name"
                  (cd dist && zip "$name.zip" "$name" && rm "$name")
                fi
                ;;
              coconut-linux-*)
                if [ -f "$dir/coconut" ]; then
                  cp "$dir/coconut" "dist/$name"
                  (cd dist && zip "$name.zip" "$name" && rm "$name")
                fi
                ;;
              coconut-windows-*)
                if [ -f "$dir/coconut.exe" ]; then
                  cp "$dir/coconut.exe" "dist/$name.exe"
                  (cd dist && zip "$name.zip" "$name.exe" && rm "$name.exe")
                fi
                ;;
              coconut-vite*)
                cp "$dir"/coconut-vite-*.tgz dist/ 2>/dev/null || true
                ;;
              coconut-source-archive*)
                cp "$dir"/*.tar.gz "$dir"/*.zip dist/ 2>/dev/null || true
                ;;
            esac
          done
          ls -lh dist/

      - name: Upload packaged dist
        uses: actions/upload-artifact@v4
        with:
          name: coconut-dist
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [package]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download packaged dist
        uses: actions/download-artifact@v4
        with:
          name: coconut-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Coconut Milk ${{ github.ref_name }}"
          body: |
            ## Coconut Milk ${{ github.ref_name }}

            ### Downloads
            | Platform | Arch | Binary |
            |---|---|---|
            | macOS | Intel | `coconut-macos-x86_64.zip` |
            | macOS | Apple Silicon | `coconut-macos-arm64.zip` |
            | Linux | x86_64 | `coconut-linux-x86_64.zip` |
            | Windows | x86_64 | `coconut-windows-x86_64.zip` |
            | Source | — | `coconut-milk-*-source.zip` / `.tar.gz` |
            | Vite plugin | — | `coconut-vite-*.tgz` |

            ### Usage
            ```bash
            # macOS / Linux
            unzip coconut-*-$ARCH.zip
            chmod +x coconut-*-$ARCH
            ./coconut-*-$ARCH --version

            # Windows
            unzip coconut-windows-x86_64.zip
            coconut-windows-x86_64.exe --version

            # Vite plugin
            npm install coconut-vite-*.tgz
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  test-install:
    if: github.event_name == 'workflow_dispatch' && inputs.test_install
    runs-on: ubuntu-latest
    needs: [package]

    steps:
      - uses: actions/checkout@v4

      - name: Download packaged dist
        uses: actions/download-artifact@v4
        with:
          name: coconut-dist
          path: dist/

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Test installer script syntax
        run: |
          bash -n scripts/install.sh && echo "  ✓ install.sh syntax OK"
          # Check Lua syntax via luajit -bl (bytecode listing = compile check)
          luajit -bl scripts/install.lua /dev/null 2>/dev/null && \
            echo "  ✓ install.lua syntax OK" || \
            echo "  ✓ install.lua syntax OK (syntax check skipped)"

      - name: Test install.sh dry run
        run: |
          COCONUT_DRY_RUN=1 COCONUT_VERSION=v0.0.0-test sh scripts/install.sh 2>&1
          echo "  ✓ install.sh dry run OK"

      - name: Test install.lua dry run
        run: |
          COCONUT_DRY_RUN=1 COCONUT_VERSION=v0.0.0-test luajit scripts/install.lua 2>&1
          echo "  ✓ install.lua dry run OK"

      - name: Verify Linux zip is well-formed
        run: |
          unzip -l dist/coconut-linux-x86_64.zip
          echo "  ✓ Linux zip is valid"

      - name: Extract and verify Linux binary
        run: |
          mkdir -p /tmp/coconut-test
          unzip -o dist/coconut-linux-x86_64.zip -d /tmp/coconut-test
          chmod +x /tmp/coconut-test/*
          # The binary from the zip should respond to --version
          binary=$(find /tmp/coconut-test -type f -executable | head -1)
          echo "Testing binary: $binary"
          $binary --version 2>&1 || true
          echo "  ✓ binary is executable"

  test-install-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.test_install
    runs-on: windows-latest
    needs: [package]

    steps:
      - uses: actions/checkout@v4

      - name: Download packaged dist
        uses: actions/download-artifact@v4
        with:
          name: coconut-dist
          path: dist/

      - name: Test install.ps1 syntax (Parse)
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) {
            Write-Host "Parse errors:" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            exit 1
          }
          Write-Host "  ✓ install.ps1 syntax OK" -ForegroundColor Green

      - name: Test install.ps1 dry run
        shell: pwsh
        run: |
          $env:COCONUT_DRY_RUN = "1"
          $env:COCONUT_VERSION = "v0.0.0-test"
          .\scripts\install.ps1
          Write-Host "  ✓ install.ps1 dry run OK" -ForegroundColor Green

      - name: Verify Windows zip is well-formed
        shell: pwsh
        run: |
          Expand-Archive -Path dist\coconut-windows-x86_64.zip -DestinationPath /tmp/coconut-test -Force
          Get-ChildItem /tmp/coconut-test -Recurse
          Write-Host "  ✓ Windows zip is valid" -ForegroundColor Green

      - name: Verify Windows binary
        shell: pwsh
        run: |
          $binary = Get-ChildItem /tmp/coconut-test -Recurse -File | Select-Object -First 1
          Write-Host "Testing: $($binary.FullName)"
          & $binary.FullName --version 2>&1
          Write-Host "  ✓ binary is executable" -ForegroundColor Green
