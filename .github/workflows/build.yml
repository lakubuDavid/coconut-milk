# Build artifacts for the coconut-milk release.
# Triggered by pushing a tag matching v*.*.* or manually.
name: build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure (download deps)
        run: xmake f -m release -p macosx -a ${{ matrix.arch }} -y

      - name: Build coconut binary
        run: xmake build -v coconut

      - name: Build and run tests
        run: |
          xmake build -v tests
          xmake run tests

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/macosx/${{ matrix.arch }}/release/coconut dist/coconut-macos-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coconut-macos-${{ matrix.arch }}
          path: dist/coconut-macos-${{ matrix.arch }}

  build-vite-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package coconut-vite as npm tarball
        run: |
          mkdir -p dist
          cd packages/coconut-vite
          npm pack --pack-destination ../../dist/

      - name: Upload vite package artifact
        uses: actions/upload-artifact@v4
        with:
          name: coconut-vite-package
          path: dist/coconut-vite-*.tgz

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-vite-package]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Coconut Milk ${{ github.ref_name }}"
          body: |
            ## Coconut Milk ${{ github.ref_name }}

            ### What's included
            - `coconut` — macOS (x86_64) binary
            - `coconut-vite` — Vite plugin package (`.tgz`)

            ### Quick start
            ```bash
            # Binary
            chmod +x coconut-macos-x86_64
            ./coconut --version

            # Vite plugin (in your project)
            npm install coconut-vite-*.tgz
            ```
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
