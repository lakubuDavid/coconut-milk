# Build artifacts for the coconut-milk release.
# Triggered by pushing a tag matching v*.*.* or manually.
name: build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install xmake
        uses: xmake-actions/setup-xmake@v2

      - name: Install dependencies (luajit, sol2, nlohmann_json, lunasvg)
        run: |
          xmake f -m release -p macosx -a ${{ matrix.arch }} -y

      - name: Build coconut binary
        run: xmake build -v coconut

      - name: Build and run tests
        run: |
          xmake build -v tests
          xmake run tests

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/macosx/${{ matrix.arch }}/release/coconut dist/coconut-macos-${{ matrix.arch }}
          cp -r packages dist/packages
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coconut-macos-${{ matrix.arch }}
          path: dist/

  build-vite-package:
    runs-on: ubuntu-latest
    needs: [build-macos]

    steps:
      - uses: actions/checkout@v4

      - name: Package coconut-vite
        run: |
          mkdir -p dist
          cd packages/coconut-vite
          npm pack --pack-destination ../../dist/
        working-directory: .

      - name: Upload vite package artifact
        uses: actions/upload-artifact@v4
        with:
          name: coconut-vite-package
          path: dist/coconut-vite-*.tgz

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-vite-package]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Coconut Milk ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}

            ### Included
            - `coconut` binary (macOS ${{ github.ref_name }})
            - `coconut-vite` npm package
            
            ### Installation
            ```bash
            # Download the binary and make it executable
            chmod +x coconut-macos-x86_64
            
            # Install the vite plugin
            npm install coconut-vite-*.tgz
            ```
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
