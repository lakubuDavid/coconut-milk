# ─────────────────────────────────────────────────────────────────────
# apps/coconut — app-level tasks
#
#   mise run build        → configure + build debug
#   mise run build-release
#   mise run test
#   mise run run
#   mise run clean
#   mise run format
#   mise run check
# ─────────────────────────────────────────────────────────────────────

[tools]
bun = "latest"
typos = "latest"
# Inherit root tools EXCEPT clang: the app builds with Apple/Xcode clang;
# mise's LLVM shims on PATH change xmake's detection and break ObjC++ std flags.
clang = false

[tasks.default]
description = "List available tasks"
run = "mise tasks ls"

# ── Build ────────────────────────────────────────────────────────────

[tasks.build]
description = "Configure (debug) and build the coconut binary"
run = ["xmake f -m debug -y", "xmake build coconut"]

[tasks.build-release]
description = "Configure (release) and build the coconut binary"
run = ["xmake f -m release -y", "xmake build coconut"]

[tasks.build-asan]
description = "Configure and build with AddressSanitizer"
run = ["xmake f -m asan -y", "xmake build coconut"]

[tasks.build-tsan]
description = "Configure and build with ThreadSanitizer"
run = ["xmake f -m tsan -y", "xmake build coconut"]

[tasks.build-ubsan]
description = "Configure and build with UndefinedBehaviorSanitizer"
run = ["xmake f -m ubsan -y", "xmake build coconut"]

[tasks.embeds]
description = "Regenerate the TS→JS bridge embed (coconut_embed.h)"
run = "xmake bridge_embeds"

# ── Run ──────────────────────────────────────────────────────────────

[tasks.run]
description = "Build (debug) and run the coconut app"
depends = ["build"]
run = "xmake run coconut"

[tasks.run-release]
description = "Build (release) and run the coconut app"
depends = ["build-release"]
run = "xmake run coconut"

# ── Tests ────────────────────────────────────────────────────────────

[tasks.test]
description = "Configure (debug), build, and run the test suite"
run = ["xmake f -m debug -y", "xmake build tests", "xmake run tests"]

[tasks.test-release]
description = "Build and run the test suite in release mode"
run = ["xmake f -m release -y", "xmake build tests", "xmake run tests"]

[tasks.test-asan]
description = "Build and run the test suite under AddressSanitizer"
run = ["xmake f -m asan -y", "xmake build tests", "xmake run tests"]

# ── Housekeeping ─────────────────────────────────────────────────────

[tasks.clean]
description = "Clean xmake build artifacts"
run = "xmake clean"

[tasks.rebuild]
description = "Clean and rebuild (debug)"
depends = ["clean", "build"]

[tasks.format]
description = "Format C++ sources with clang-format"
run = "find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format -i"

[tasks.check]
description = "Static-check C++ sources with clang-tidy"
run = "find src tests -name '*.cpp' -o -name '*.h' | xargs clang-tidy"

[tasks.typos]
description = "Spell-check sources with typos"
run = "typos src"
[tasks."typos:fix"]
description = "Spell-check sources with typos"
run = "typos src -w"

[tasks.install]
description = "Build (debug) and symlink the binary into ~/tools"
depends = ["build"]
run = "bash ../../scripts/mise-install.sh"

[tasks.install-release]
description = "Build (release) and symlink the binary into ~/tools"
depends = ["build-release"]
run = "bash ../../scripts/mise-install.sh"
