monorepo_root = true

[monorepo]
config_roots = [
  "apps/coconut",
  "apps/coconut-cli",
]

[tools]
bun = "latest"
clang = "latest"
d2 = "latest"
lefthook = "latest"
opengrep = "latest"
typos = "latest"
clang-format = "latest"
conan = "latest"

# ─────────────────────────────────────────────────────────────────────
# Workspace-level tasks — delegates to app-level mise.toml configs.
#
#   mise run <task>     (alias: mise r <task>)
#   mise tasks          (list all tasks)
#   mise run            (no args → default task)
#
# All build / run / test / housekeeping tasks are defined in
# apps/coconut/mise.toml.  The root tasks below act as aliases with
# explicit depends = ["//apps/coconut:<task>"] so they show up at the
# workspace level.
#
# First run may prompt:  mise trust   (approve this config file)
# ─────────────────────────────────────────────────────────────────────

[tasks.default]
description = "List available tasks"
run = "mise tasks ls"

# ── Build ────────────────────────────────────────────────────────────

[tasks.build]
description = "Configure (debug) and build the coconut binary"
depends = ["//apps/coconut:build"]

[tasks.build-release]
description = "Configure (release) and build the coconut binary"
depends = ["//apps/coconut:build-release"]

[tasks.build-asan]
description = "Configure and build with AddressSanitizer"
depends = ["//apps/coconut:build-asan"]

[tasks.build-tsan]
description = "Configure and build with ThreadSanitizer"
depends = ["//apps/coconut:build-tsan"]

[tasks.build-ubsan]
description = "Configure and build with UndefinedBehaviorSanitizer"
depends = ["//apps/coconut:build-ubsan"]

[tasks.embeds]
description = "Regenerate the TS→JS bridge embed (coconut_embed.h)"
depends = ["//apps/coconut:embeds"]

# ── coconut-cli (generator + scaffolder) ─────────────────────────────
# Plain task names live in apps/coconut-cli/mise.toml.
#
#   mise run //apps/coconut-cli:build
#   mise run //apps/coconut-cli:generate [cmdRoot] [--out-dir D] [--watch]
#   mise run //apps/coconut-cli:new [-y]
#
# The task executes inside apps/coconut-cli, so when generating for
# another project pass absolute paths:
#
#   mise run //apps/coconut-cli:generate \
#       /abs/path/to/project/commands --out-dir /abs/path/to/project/generated
# ─────────────────────────────────────────────────────────────────────

# ── Run ──────────────────────────────────────────────────────────────

[tasks.run]
description = "Build (debug) and run the coconut app"
depends = ["//apps/coconut:run"]

[tasks.run-release]
description = "Build (release) and run the coconut app"
depends = ["//apps/coconut:run-release"]

# ── Tests ────────────────────────────────────────────────────────────

[tasks.test]
description = "Configure (debug), build, and run the test suite"
depends = ["//apps/coconut:test"]

[tasks.test-release]
description = "Build and run the test suite in release mode"
depends = ["//apps/coconut:test-release"]

[tasks.test-asan]
description = "Build and run the test suite under AddressSanitizer"
depends = ["//apps/coconut:test-asan"]

# ── Housekeeping ─────────────────────────────────────────────────────

[tasks.clean]
description = "Clean xmake build artifacts"
depends = ["//apps/coconut:clean"]

[tasks.rebuild]
description = "Clean and rebuild (debug)"
depends = ["//apps/coconut:rebuild"]

[tasks.format]
description = "Format C++ sources with clang-format"
depends = ["//apps/coconut:format"]

[tasks.check]
description = "Static-check C++ sources with clang-tidy"
depends = ["//apps/coconut:check"]

[tasks.typos]
description = "Spell-check sources with typos"
depends = ["//apps/coconut:typos"]
[tasks."typos:fix"]
description = "Spell-check sources with typos"
depends = ["//apps/coconut:typos:fix"]

[tasks.install]
description = "Build (debug) and symlink the binary into ~/tools"
depends = ["//apps/coconut:install"]

[tasks.install-release]
description = "Build (release) and symlink the binary into ~/tools"
depends = ["//apps/coconut:install-release"]

# ── Release ──────────────────────────────────────────────────────────

[tasks.release]
description = "Cut a release: build, tag vX.Y.Z, push to origin (CI publishes the GitHub release)"
depends = ["//apps/coconut:release"]
